[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-autoclicker"
version = "1.0.0"
description = "A configurable desktop autoclicker"
requires-python = ">=3.10"
dependencies = ["pynput>=1.7.6,<2"]

[project.scripts]
autoclicker = "autoclicker.app:main"

[tool.setuptools.packages.find]
include = ["autoclicker*"]
